services:

  mongo:
    image: mongo:8
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-painite}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-painite}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-painite}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      CI: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
