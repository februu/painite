services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-painite}
      POSTGRES_USER: ${POSTGRES_USER:-painite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-painite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-painite} -d ${POSTGRES_DB:-painite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-painite}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-painite}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-painite}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override localhost with docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-painite}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-painite}
      MONGO_DB: ${MONGO_DB:-painite}
    ports:
      - "5173:5173"
    volumes:
      # Mount source for live reload; keep node_modules from the image layer
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  